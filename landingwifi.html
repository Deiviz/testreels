<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="description" />
    <meta name="viewport" content="width=device-width" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="generator" content="Astro v4.15.4" />
    <title>Drama Miau PT – Identifica‑te e diverte‑te</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body class="layout-main-stretch space-y-4 pb-4">
    <section class="flex items-center space-x-38 bg-surface-body py-2 px-4">
      <section class="o-Container">
        <img src="assets/logo.png" class="" alt="logo" />
      </section>
    </section>
    <main class="o-Container flex flex-col grow space-y-6 px-4">
      <img src="assets/heroindex.png" class="image-full" alt="heroindex" />
      <section class="o-Container flex flex-col space-y-4">
        <h2 class="h2 text-left"><b class="!font-bold">Desfruta dos melhores microdramas, sem limites e sem esperas</b></h2>
      </section>
      <form class="flex flex-col space-y-6" id="formpage" method="post" onsubmit="return validateForm()" novalidate>
        <div class="ms-InputGroup --" data-input-group="input-id">
          <label class="ms-InputGroup__label" for="input-id"> Introduza o seu número de telemóvel para continuar: </label>
          <input class="ms-InputField" type="number" id="input-id" name="input-id" value="" placeholder="Número de telemóvel" maxlength="9" minlength="1" data-prefix="962" />
          <p id="error-input-id" class="ms-InputError hide">Número de telefone inválido</p>
        </div>
      </form>

      <input type="submit" value="Continuar" class="ms-Button --submit" form="formpage" />
      <script>
        // Manejador de eventos para limpiar errores al escribir
        document.querySelectorAll(".ms-InputField").forEach((input) => {
          input.addEventListener("input", () => {
            const group = input.closest(".ms-InputGroup");
            if (!group) return;

            const errorElement = group.querySelector(".ms-InputError");
            errorElement.classList.add("hide");
            input.classList.remove("is-error");

            // Eliminar mensaje de "no coinciden" si existe
            const mismatchError = group.querySelector(".ms-InputError-mismatch");
            if (mismatchError) mismatchError.remove();

            if (input.type === "number") {
              const prefix = input.getAttribute("data-prefix");
              const maxLength = input.maxLength;
              const allowedLength = prefix ? maxLength + prefix.length : maxLength;
              if (input.value.length > allowedLength) {
                input.value = input.value.slice(0, allowedLength);
              }
            }
          });
        });

        function validateForm() {
          let isValid = true;
          const inputGroups = document.querySelectorAll("[data-input-group]");
          const passwordInputs = [];

          inputGroups.forEach((group) => {
            const input = group.querySelector(".ms-InputField");
            const errorElement = group.querySelector(".ms-InputError");

            errorElement.classList.add("hide");
            const oldMismatch = group.querySelector(".ms-InputError-mismatch");
            if (oldMismatch) oldMismatch.remove();

            if (input.type === "number") {
              if (!validatePhoneNumber(input)) {
                markAsInvalid(input, errorElement);
                isValid = false;
              }
            } else if (input.type === "email") {
              if (!validateEmail(input)) {
                markAsInvalid(input, errorElement);
                isValid = false;
              }
            } else if (input.type === "password") {
              passwordInputs.push({ input, errorElement, group });
              if (!validatePassword(input)) {
                markAsInvalid(input, errorElement);
                isValid = false;
              }
            } else if (input.type === "text") {
              if (!validateTextField(input)) {
                markAsInvalid(input, errorElement);
                isValid = false;
              }
            }
          });

          // Validación de coincidencia con inyección de <p>
          if (passwordInputs.length === 2 && isValid) {
            const [p1, p2] = passwordInputs;
            if (p1.input.value !== p2.input.value) {
              p2.input.classList.add("is-error");

              // Clonamos el error original para mantener estilos de Astro
              const newError = p2.errorElement.cloneNode(true);
              newError.classList.remove("hide");
              newError.classList.add("ms-InputError-mismatch");
              newError.textContent = "passwords no coinciden";

              p2.group.appendChild(newError);
              isValid = false;
            }
          }

          return isValid;
        }

        function markAsInvalid(input, errorElement) {
          input.classList.add("is-error");
          errorElement.classList.remove("hide");
        }

        function validatePassword(input) {
          // Leemos el minlength directamente del HTML
          const minLen = input.getAttribute("minlength") || 8;
          // Regex dinámica: una letra y longitud basada en el atributo
          const passwordRegex = new RegExp(`^(?=.*[A-Za-z]).{${minLen},}$`);
          return passwordRegex.test(input.value);
        }

        function validatePhoneNumber(input) {
          const value = input.value;
          const maxLength = parseInt(input.getAttribute("maxlength"));
          const prefix = input.getAttribute("data-prefix") || "";
          if (value.length === maxLength) return true;
          return value.length === maxLength + prefix.length && value.startsWith(prefix);
        }

        function validateEmail(input) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);
        }

        function validateTextField(input) {
          const minLen = input.getAttribute("minlength");
          if (minLen && input.value.length < parseInt(minLen)) return false;
          return input.value.trim() !== "";
        }
      </script>

      <p class="base color-neutral-200 text-left">Uma vez confirmado, receberá um código de confirmação por SMS.</p>
    </main>
