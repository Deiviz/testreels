  function toggleGlobalMute(btn) {
    // 1. Invertir el estado global
    isGlobalMuted = !isGlobalMuted;

    // 2. Buscar TODOS los reproductores JW en la página
    const allPlayers = document.querySelectorAll(".jwplayer");

    allPlayers.forEach((playerDiv) => {
      const playerInstance = jwplayer(playerDiv.id);
      // Aplicar el estado a cada instancia
      playerInstance.setMute(isGlobalMuted);
      // --- LÓGICA PARA FORZAR PORTUGUÉS AL CARGAR ---
      // Escuchamos el evento 'meta' que es cuando JW Player ya conoce los tracks disponibles
      playerInstance.on("meta", () => {
        const tracks = playerInstance.getAudioTracks();
        // Buscamos el índice del track que contenga "portugu" (ignorando mayúsculas y acentos)
        const ptIndex = tracks.findIndex(
          (t) =>
            t.label
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .includes("portu"),
          // t.label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes("portugue")
        );

        // Si encontramos el track y no es el que ya está seleccionado, lo cambiamos
        if (ptIndex !== -1 && playerInstance.getCurrentAudioTrack() !== ptIndex) {
          playerInstance.setCurrentAudioTrack(ptIndex);
          console.log(`Idioma cambiado a Portugués en el player: ${playerContainer.id}`);
        }
      });
    });

    // 3. Actualizar los iconos de TODOS los botones de mute para que coincidan
    const allMuteBtns = document.querySelectorAll(".mute-toggle");
    allMuteBtns.forEach((mBtn) => {
      mBtn.innerHTML = isGlobalMuted ? SVG_MUTE : SVG_UNMUTE;
    });

    console.log("Estado de mute global:", isGlobalMuted);
  }

  function openTrackModal(type, btn) {
    // 1. Encontrar el player que pertenece a este slide
    const slide = btn.closest(".slide");
    const playerDiv = slide.querySelector(".jwplayer");
    if (!playerDiv) return;

    activePlayerId = playerDiv.id;
    const player = jwplayer(activePlayerId);
    const modal = document.getElementById("trackModal");
    const list = document.getElementById("modalList");
    const title = document.getElementById("modalTitle");

    list.innerHTML = ""; // Limpiar lista
    modal.style.display = "flex";

    if (type === "audio") {
      title.innerText = "Idioma do áudio";
      const tracks = player.getAudioTracks();
      const current = player.getCurrentAudioTrack();

      tracks.forEach((track, index) => {
        const li = document.createElement("li");
        li.innerText = track.name || `Pista ${index}`;
        if (index === current) li.className = "active";
        li.onclick = () => {
          player.setCurrentAudioTrack(index);
          closeModal();
        };
        list.appendChild(li);
      });
    } else {
      title.innerText = "Legendas";
      const captions = player.getCaptionsList(); // Incluye "Off"
      const current = player.getCurrentCaptions();

      captions.forEach((cap, index) => {
        const li = document.createElement("li");
        li.innerText = cap.label;
        if (index === current) li.className = "active";
        li.onclick = () => {
          player.setCurrentCaptions(index);
          closeModal();
        };
        list.appendChild(li);
      });
    }
  }

  function closeModal() {
    document.getElementById("trackModal").style.display = "none";
  }

  // Cerrar modal si hacen click fuera del contenido
  window.onclick = function (event) {
    const modal = document.getElementById("trackModal");
    if (event.target == modal) closeModal();
  };

  });

  // 1. Función para alternar Play/Pause al pulsar el botón
  function togglePlayPause(btn) {
    const slide = btn.closest(".slide");
    const playerElement = slide.querySelector(".jwplayer");
    if (!playerElement) return;

    const player = jwplayer(playerElement);
    const state = player.getState();
    /*   player.setup({captions: {
        fontSize: 12, // Tamaño en píxeles
        backgroundOpacity: 50, // Opcional: fondo semitransparente
        color: "#FFFFFF" // Opcional: color del texto
    }
  }); */

    if (state === "playing" || state === "buffering") {
      player.pause();
    } else {
      player.play();
    }
  }

  // 2. Modificamos tu función existente para que actualice los iconos automáticamente
  // 2. Modificamos tu función existente para que actualice los iconos automáticamente
  function iniciarSincronizacionBarras() {
    const slides = document.querySelectorAll(".slide");

    slides.forEach((slide) => {
      const playerContainer = slide.querySelector(".jwplayer");
      const progressBarFill = slide.querySelector(".custom-progress-fill");
      const playBtn = slide.querySelector(".play-pause-btn");

      if (playerContainer) {
        const playerInstance = jwplayer(playerContainer.id);

        // 1. Definimos la lógica de cambio de idioma en una función interna
        const forcePortuguese = () => {
          const tracks = playerInstance.getAudioTracks();
          if (tracks && tracks.length > 0) {
            const ptIndex = tracks.findIndex((t) =>
              (t.label || t.name || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .includes("portu"),
            );
            if (ptIndex !== -1 && playerInstance.getCurrentAudioTrack() !== ptIndex) {
              playerInstance.setCurrentAudioTrack(ptIndex);
              console.log("Idioma forzado a Portugués en:", playerContainer.id);
            }
          }
        };

        // 2. Intentamos ejecutarlo de inmediato (por si ya cargó)
        forcePortuguese();

        // 3. Lo dejamos escuchando para cuando cambie el item o carguen metadatos (por si no había cargado aún)
        playerInstance.on("playlistItem", forcePortuguese);
        playerInstance.on("meta", forcePortuguese);

        // --- MANTENER TU LÓGICA DE ICONOS Y BARRA ---
        playerInstance.on("play", () => {
          if (playBtn) playBtn.innerHTML = SVG_PAUSE;
        });
        playerInstance.on("pause", () => {
          if (playBtn) playBtn.innerHTML = SVG_PLAY;
        });

        playerInstance.on("time", function (event) {
          if (event.duration > 0 && progressBarFill) {
            const porcentaje = (event.position / event.duration) * 100;
            progressBarFill.style.width = porcentaje + "%";
          }
        });
      }
    });
  }

  function ajustarTamanoVideoContainer() {
    const videoContainers = document.querySelectorAll(".video-container");
    // Buscamos el primer player que ya esté listo en el DOM
    const playerActual = document.querySelector(".jwplayer");
    const alturaViewport = window.innerHeight;
    const STICKY_NAV_HEIGHT = 62;
    const isIphone = document.documentElement.classList.contains("is-iphone");
    const alturaVideo = isIphone ? Math.round(alturaViewport - STICKY_NAV_HEIGHT) : alturaViewport;

    if (playerActual && playerActual.offsetHeight > 0) {
      // Obtenemos las dimensiones reales actuales
      const anchoOriginal = playerActual.offsetWidth;
      const altoOriginal = playerActual.offsetHeight;

      const relacionAspecto = anchoOriginal / altoOriginal;
      const nuevoAncho = Math.round(alturaVideo * relacionAspecto);

      videoContainers.forEach((container) => {
        container.style.width = nuevoAncho + "px";
        container.style.height = alturaVideo + "px";
      });

      console.log("Tamaño ajustado: " + nuevoAncho + "x" + alturaVideo);
    } else {
      // Si no está listo, reintentamos en 100ms
      setTimeout(ajustarTamanoVideoContainer, 100);
    }
  }

  // Llamadas seguras
  window.addEventListener("load", () => {
    // Intentamos ajustar varias veces para asegurar el renderizado
    ajustarTamanoVideoContainer();
  });
  window.addEventListener("resize", ajustarTamanoVideoContainer);

  // También lo llamamos cuando la sincronización de barras empieza,
  // porque ahí ya sabemos que los players existen
</script>
